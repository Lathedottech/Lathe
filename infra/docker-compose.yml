services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      LATHE_OWNER_ROLE: ${LATHE_DB_OWNER_ROLE:?set LATHE_DB_OWNER_ROLE}
      LATHE_OWNER_PASSWORD: ${LATHE_DB_OWNER_PASSWORD:?set LATHE_DB_OWNER_PASSWORD}
      LATHE_APP_ROLE: ${LATHE_DB_APP_ROLE:?set LATHE_DB_APP_ROLE}
      LATHE_APP_PASSWORD: ${LATHE_DB_APP_PASSWORD:?set LATHE_DB_APP_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - lathe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lathe-pgdata:
